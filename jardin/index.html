<title>Mi Jardín de Estudio · NasriTools</title>

<style>
:root{
  --papel:#F8F3FB; --lienzo:#FFFFFF; --hueco:#EFE6F6;
  --tinta:#3A2450; --tinta-2:#6E5A82; --suave:#A898B8;
  --rosa:#E8578B; --rosa-claro:#FCE4EE; --lila:#9B7BD4; --lila-claro:#EEE6FA;
  --sol:#F6B940; --sol-claro:#FDF1D6;
  --bien:#2F9E7E; --bien-claro:#DDF3EC; --mal:#D5503F; --mal-claro:#FBE4E0;
  --borde:#E5D8EF; --sombra:0 1px 2px rgba(58,36,80,.06),0 8px 22px rgba(58,36,80,.08);
  --r:16px;
  --f-tit:'Baloo 2','Trebuchet MS',sans-serif; --f-lee:'Andika','Comic Sans MS',sans-serif; --f-ui:'Nunito','Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#1C1426; --lienzo:#261B33; --hueco:#322442; --tinta:#F3EAFB; --tinta-2:#C6B5D8; --suave:#8E7BA3;
  --rosa:#FF7FAA; --rosa-claro:#4A2336; --lila:#B79BF0; --lila-claro:#35284C; --sol:#FFC85C; --sol-claro:#43361A;
  --bien:#5FD0AC; --bien-claro:#193B31; --mal:#F08070; --mal-claro:#45221E; --borde:#3C2D50;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --papel:#1C1426; --lienzo:#261B33; --hueco:#322442; --tinta:#F3EAFB; --tinta-2:#C6B5D8; --suave:#8E7BA3;
  --rosa:#FF7FAA; --rosa-claro:#4A2336; --lila:#B79BF0; --lila-claro:#35284C; --sol:#FFC85C; --sol-claro:#43361A;
  --bien:#5FD0AC; --bien-claro:#193B31; --mal:#F08070; --mal-claro:#45221E; --borde:#3C2D50;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-ui);font-size:16px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--f-tit);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--rosa);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;background:var(--lienzo);border-bottom:1px solid var(--borde)}
.marca{display:flex;align-items:center;gap:8px;font-family:var(--f-tit);font-weight:700;font-size:19px}
.sep{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;background:var(--hueco);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.chip.rosa{background:var(--rosa-claro);color:var(--rosa)} .chip.sol{background:var(--sol-claro);color:#A2700E}
:root[data-theme="dark"] .chip.sol{color:var(--sol)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.sol{color:var(--sol)}}
.icono{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--hueco);font-size:18px}

main{max-width:1020px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.saludo{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.saludo h1{font-size:clamp(28px,5vw,40px);color:var(--tinta)}
.saludo h1 em{font-style:normal;color:var(--rosa)}
.saludo p{margin:2px 0 0;color:var(--tinta-2);max-width:60ch}
.progreso{display:flex;align-items:center;gap:12px;margin-top:10px}
.barra-p{flex:1;max-width:340px;height:12px;border-radius:99px;background:var(--hueco);overflow:hidden}
.barra-p i{display:block;height:100%;background:linear-gradient(90deg,var(--lila),var(--rosa));border-radius:99px}

.titulo-sec{font-family:var(--f-tit);font-size:22px;margin:26px 0 12px;display:flex;align-items:baseline;gap:10px}
.titulo-sec small{font-family:var(--f-ui);font-size:14px;color:var(--tinta-2);font-weight:600}

.estante{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.libro{text-align:left;display:flex;flex-direction:column;gap:8px;padding:0}
.libro .tapa{border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:var(--sombra),inset 6px 0 0 rgba(0,0,0,.12);transition:transform .2s}
.libro:hover .tapa{transform:translateY(-4px) rotate(-1deg)}
.libro svg{display:block;width:100%;height:auto}
.libro .nm{font-weight:800;font-size:15px}
.libro .mini{font-size:13px;color:var(--tinta-2);display:flex;justify-content:space-between}

.hoy{background:var(--lienzo);border:1px solid var(--borde);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--sombra)}
.hoy .flor{font-size:34px}
.hoy .txt{flex:1;min-width:200px}
.hoy b{font-family:var(--f-tit);font-size:19px;display:block}
.hoy span{color:var(--tinta-2);font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;background:var(--rosa);color:#fff;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.sec{background:var(--hueco);color:var(--tinta);box-shadow:none}
.btn.lila{background:var(--lila)}

.herrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.herr{background:var(--lienzo);border:1px solid var(--borde);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.herr:hover{border-color:var(--lila)}
.herr .ic{font-size:24px} .herr .nm{font-weight:800} .herr .ds{font-size:13px;color:var(--tinta-2)}

/* Botón «volver»: grande, con color y una flecha en círculo, para que se vea que es para ir atrás */
.volver{display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;padding:8px 18px 8px 8px;border-radius:999px;
  background:var(--lila-claro);color:var(--tinta);font-family:var(--f-tit);font-weight:700;font-size:18px;
  border:2px solid var(--lila);box-shadow:0 3px 0 rgba(155,123,212,.35);transition:transform .15s}
.volver .flecha{width:36px;height:36px;border-radius:50%;background:var(--lila);color:#fff;display:grid;place-items:center;font-size:22px;line-height:1}
.volver:hover{transform:translateX(-3px)}
.volver:active{transform:translateY(2px);box-shadow:none}
.cab-mat{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.cab-mat .tapa{width:110px;border-radius:4px 10px 10px 4px;overflow:hidden;box-shadow:var(--sombra)}
.cab-mat svg{display:block;width:100%;height:auto}
.tri{font-family:var(--f-tit);font-size:17px;color:var(--tinta-2);margin:18px 0 8px}
.unis{display:grid;gap:10px}
.uni{display:flex;align-items:center;gap:12px;background:var(--lienzo);border:1px solid var(--borde);border-radius:var(--r);padding:12px 14px;text-align:left}
.uni:hover{border-color:var(--lila)}
.uni .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--hueco);flex:0 0 auto}
.uni.lista .num{background:var(--bien);color:#fff}
.uni .t{flex:1;font-weight:700}
.uni .e{font-size:13px;color:var(--tinta-2)}

.leccion{background:var(--lienzo);border:1px solid var(--borde);border-radius:20px;padding:clamp(16px,3vw,26px);box-shadow:var(--sombra)}
.explica{font-family:var(--f-lee);font-size:18px;line-height:1.6;max-width:65ch}
.explica ul{padding-left:20px}
.ejemplo{background:var(--sol-claro);border-radius:12px;padding:10px 14px;font-family:var(--f-lee);font-size:18px;margin:10px 0}
.preg{font-family:var(--f-lee);font-size:21px;margin:10px 0 14px}
.ops{display:grid;gap:10px}
.op{padding:12px 16px;border-radius:14px;background:var(--hueco);text-align:left;font-family:var(--f-lee);font-size:18px;border:2px solid transparent}
.op:hover{border-color:var(--lila)}
.op.si{background:var(--bien-claro);border-color:var(--bien)} .op.no{background:var(--mal-claro);border-color:var(--mal)}
.entrada{display:flex;gap:10px;flex-wrap:wrap}
.entrada input{flex:1;min-width:140px;font-family:var(--f-lee);font-size:20px;padding:10px 14px;border-radius:14px;border:2px solid var(--borde);background:var(--papel);color:var(--tinta)}
.veredicto{margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:700}
.veredicto.si{background:var(--bien-claro);color:var(--bien)} .veredicto.no{background:var(--mal-claro);color:var(--mal)}
.pasos{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pasos i{width:26px;height:8px;border-radius:99px;background:var(--hueco)}
.pasos i.si{background:var(--bien)} .pasos i.no{background:var(--mal)} .pasos i.ya{background:var(--lila)}
.fin{text-align:center;padding:10px}
.fin .grande{font-size:56px}
.mandos{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.velo{position:fixed;inset:0;background:rgba(28,20,38,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--lienzo);border-radius:20px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--sombra);position:relative}
.modal h2{margin-bottom:8px}
.cerrar{position:absolute;top:12px;right:12px}
table.glosa{width:100%;border-collapse:collapse;font-size:15px}
.glosa td,.glosa th{padding:7px 6px;border-bottom:1px solid var(--borde);text-align:left}
.glosa td[dir=rtl]{text-align:right;font-size:16px}
.buscador{width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--borde);background:var(--papel);color:var(--tinta);font-size:16px;margin-bottom:10px}
.ar{direction:rtl;text-align:right;font-family:'Segoe UI',Tahoma,sans-serif;line-height:1.8}
.lectura{font-family:var(--f-lee);font-size:20px;line-height:1.7;background:var(--papel);padding:14px;border-radius:12px}
.tabla-num{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-variant-numeric:tabular-nums}
.tabla-num div{background:var(--hueco);padding:8px;border-radius:10px;text-align:center;font-family:var(--f-lee);font-size:17px}
.enlace{color:var(--rosa);font-weight:800}
.modal.ancho{max-width:1100px;height:90vh;display:flex;flex-direction:column;padding:14px}
.modal.ancho iframe{flex:1;width:100%;border:1px solid var(--borde);border-radius:12px;background:#fff}
/* Nombre con estrella: la punta de la estrella baja y se mete en la «V» de la y */
.nombre-marca{font-family:var(--f-tit);font-weight:800;line-height:1;letter-spacing:-.01em;white-space:nowrap;
  background:linear-gradient(100deg,var(--lila) 0%,var(--rosa) 55%,#F08A4B 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.nombre-marca .y{position:relative;display:inline-block}
.nombre-marca .estrella{position:absolute;left:50%;bottom:.40em;width:.50em;height:.50em;transform:translateX(-38%) rotate(-8deg);
  filter:drop-shadow(0 .03em .05em rgba(232,87,139,.45));animation:brilla 3.2s ease-in-out infinite}
@keyframes brilla{0%,100%{transform:translateX(-38%) rotate(-8deg) scale(1);filter:drop-shadow(0 0 .02em #FFD66B)}
  50%{transform:translateX(-38%) rotate(6deg) scale(1.1);filter:drop-shadow(0 0 .12em #FFE08A) drop-shadow(0 0 .05em #fff)}}
/* Estrella de progreso: se enciende un poco con cada paso y brilla del todo al terminar */
.estrella-prog{width:56px;height:56px;flex:0 0 auto;transition:filter .5s,opacity .5s;
  opacity:calc(.35 + .65*var(--p));filter:grayscale(calc(1 - var(--p))) drop-shadow(0 0 calc(var(--p)*14px) #FFD66B)}
.estrella-prog svg{width:100%;height:100%;display:block}
.estrella-prog.chispa{animation:chispa .7s ease-out}
@keyframes chispa{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(18deg);filter:drop-shadow(0 0 22px #FFE08A) drop-shadow(0 0 6px #fff)}100%{transform:scale(1)}}
.estrella-fin{width:120px;height:120px;margin:0 auto;filter:drop-shadow(0 0 18px #FFD66B) drop-shadow(0 0 6px #fff);animation:gira 2.4s ease-in-out infinite}
.estrella-fin svg{width:100%;height:100%}
.estrella-fin.apagada{filter:grayscale(.6);opacity:.6;animation:none}
@keyframes gira{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.12) rotate(6deg)}}
.parar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--tinta);color:var(--papel);box-shadow:var(--sombra)}
.nota{font-size:13px;color:var(--tinta-2)}
</style>

{id:'mat',nom:'Matemáticas',libro:'Mate+ 4 · Serie Participa',unis:[
 {t:'Números de hasta seis cifras',tri:1,exp:`<p>Después de las unidades, decenas y centenas vienen los <b>millares</b>: unidades de millar (UM), decenas de millar (DM) y centenas de millar (CM).</p><ul><li>En <b>345.672</b>: 3 CM, 4 DM, 5 UM, 6 C, 7 D y 2 U.</li><li>Para comparar, cuenta primero las cifras; si tienen las mismas, compara de izquierda a derecha.</li><li>Para <b>redondear</b> a la centena, mira la cifra de las decenas: si es 5 o más, subes.</li></ul>`,ejemplo:'345.672 = 300.000 + 40.000 + 5.000 + 600 + 70 + 2',
  ej:[op('¿Qué cifra ocupa las decenas de millar en 345.672?',['3','4','5'],1,'Cuenta desde la derecha: U, D, C, UM, DM.'),
      es('Escribe con cifras: doscientos mil cuatrocientos',['200400'],'200.000 + 400.'),
      op('¿Qué número es MAYOR?',['98.765','123.456','99.999'],1,'123.456 tiene seis cifras; los otros, cinco.'),
      es('300.000 + 40.000 + 5.000 + 20 = ',['345020']),
      es('El número siguiente a 99.999 es...',['100000'],'Uno más: cien mil.'),
      op('Redondea 4.683 a la centena',['4.600','4.700','5.000'],1,'Las decenas son 8: subes a 4.700.')],
  reto:[es('🔥 El número anterior a 500.000 es...',['499999']),
        es('🔥 ¿Cuántas centenas hay en total en 3.400?',['34'],'3.400 : 100 = 34.'),
        op('🔥 En 708.215, el 8 vale...',['8.000','80.000','800'],0,'Está en las unidades de millar.')]},
 {t:'Sumas y restas grandes',tri:1,exp:`<p>Coloca los números en columna: <b>unidades debajo de unidades</b>. Empieza siempre por la derecha.</p><ul><li>Si una columna pasa de 9, te llevas 1 a la siguiente.</li><li><b>Prueba de la resta:</b> resultado + lo que restas = el número de arriba.</li><li>Para <b>estimar</b>, redondea primero y suma los números redondos.</li></ul>`,ejemplo:'4.567 + 2.845 = 7.412',
  ej:[es('4.567 + 2.845 = ',['7412']),
      es('8.003 − 2.456 = ',['5547'],'Pide prestado varias veces.'),
      es('Si 900 − 350 = 550, entonces 550 + 350 = ',['900'],'Es la prueba de la resta.'),
      op('Un pueblo tiene 12.450 habitantes y llegan 1.380 más. ¿Cuántos son ahora?',['13.830','11.070','13.730'],0),
      es('Estima: 3.900 + 5.100 es más o menos...',['9000'],'4.000 + 5.000.'),
      es('10.000 − 1 = ',['9999'])],
  reto:[es('🔥 25.678 + 14.322 = ',['40000']),
        es('🔥 50.000 − 23.456 = ',['26544']),
        op('🔥 Tenía 2.500 €, gasto 780 € y cobro 1.200 €. ¿Cuánto tengo?',['2.920 €','3.480 €','2.080 €'],0,'2.500 − 780 = 1.720; 1.720 + 1.200.')]},
 {t:'Multiplicar por dos cifras',tri:1,exp:`<p>Para multiplicar por un número de dos cifras, haces <b>dos multiplicaciones</b> y las sumas.</p><ul><li>45 × 12: primero 45 × 2 = 90, luego 45 × 10 = 450. Suma: 540.</li><li>Multiplicar por <b>10, 100 o 1.000</b>: añade uno, dos o tres ceros.</li><li>El orden no cambia el resultado: 7 × 48 = 48 × 7.</li></ul>`,ejemplo:'45 × 12 = 90 + 450 = 540',
  ej:[es('234 × 3 = ',['702']),
      es('45 × 12 = ',['540']),
      es('36 × 100 = ',['3600'],'Añade dos ceros.'),
      op('Una caja tiene 24 lápices. ¿Cuántos hay en 15 cajas?',['360','39','340'],0,'24 × 15.'),
      es('El triple de 150 es...',['450'],'150 × 3.'),
      es('125 × 10 = ',['1250'])],
  reto:[es('🔥 208 × 25 = ',['5200']),
        es('🔥 99 × 11 = ',['1089'],'99 × 10 + 99.'),
        es('🔥 7 × 48 = 48 × ...',['7'])]},
 {t:'La división',tri:2,exp:`<p>Dividir es <b>repartir en partes iguales</b>. Sus partes: dividendo, divisor, cociente y resto.</p><ul><li>Si el resto es 0, la división es <b>exacta</b>.</li><li>El resto siempre es más pequeño que el divisor.</li><li><b>Prueba:</b> divisor × cociente + resto = dividendo.</li></ul>`,ejemplo:'45 : 7 → cociente 6, resto 3 (7 × 6 + 3 = 45)',
  ej:[es('84 : 4 = ',['21']),
      es('96 : 8 = ',['12']),
      op('Si 45 : 7 da cociente 6, el resto es...',['3','6','7'],0,'7 × 6 = 42; 45 − 42.'),
      es('Reparto 120 cromos entre 6 amigas. Cada una recibe...',['20']),
      op('¿Cuál es una división EXACTA?',['25 : 4','36 : 6','17 : 3'],1),
      es('7 × 6 + 3 = ',['45'],'Es la prueba de la división.')],
  reto:[es('🔥 756 : 6 = ',['126']),
        es('🔥 1.000 : 8 = ',['125']),
        op('🔥 50 alumnas, 8 en cada mesa. ¿Cuántas mesas hacen falta?',['7','6','8'],0,'50 : 8 = 6 y sobran 2: hace falta otra mesa.')]},
 {t:'Las fracciones',tri:2,exp:`<p>Una fracción dice en cuántas partes iguales dividimos algo (<b>denominador</b>, abajo) y cuántas tomamos (<b>numerador</b>, arriba).</p><ul><li>3/8 de pizza: 8 trozos, tomas 3.</li><li>Con el mismo denominador, es mayor la que tiene el numerador mayor.</li><li>Para calcular 2/3 de 12: 12 : 3 = 4, y 4 × 2 = 8.</li></ul>`,ejemplo:'1/4 de 20 = 20 : 4 = 5',
  ej:[op('Una pizza tiene 8 trozos y comes 3. ¿Qué fracción comes?',['3/8','8/3','3/5'],0),
      op('¿Qué fracción es MAYOR?',['2/7','5/7','3/7'],1),
      es('La mitad de 18 es...',['9']),
      es('1/4 de 20 = ',['5']),
      op('En 3/5, el denominador es...',['3','5','8'],1,'El de abajo.'),
      es('2/3 de 12 = ',['8'],'12 : 3 = 4; 4 × 2.')],
  reto:[es('🔥 3/4 de 40 = ',['30']),
        op('🔥 ¿Qué fracción es igual a una unidad entera?',['6/6','1/6','6/1'],0),
        es('🔥 1/3 de una hora son ... minutos',['20'],'60 : 3.')]},
 {t:'Números decimales y dinero',tri:3,exp:`<p>La <b>coma</b> separa la parte entera de la decimal. La primera cifra tras la coma son las <b>décimas</b>; la segunda, las <b>centésimas</b>.</p><ul><li>2,45 € = 2 euros y 45 céntimos = 245 céntimos.</li><li>0,5 es la mitad; 0,25 es un cuarto.</li><li>Para comparar: 2,7 es mayor que 2,17 porque 7 décimas son más que 1 décima.</li></ul>`,ejemplo:'3,50 € + 1,25 € = 4,75 €',
  ej:[op('0,5 es lo mismo que...',['la mitad','un cuarto','cinco enteros'],0),
      es('2,45 € son ... céntimos',['245']),
      es('3,50 € + 1,25 € = ',['4,75']),
      op('¿Qué número es MAYOR?',['2,7','2,07','2,17'],0,'Compara las décimas: 7, 0 y 1.'),
      es('Pago con 10 € algo que cuesta 6,40 €. Me devuelven ... €',['3,60','3,6']),
      es('En 4,38 la cifra de las décimas es...',['3'])],
  reto:[es('🔥 3 × 1,25 € = ',['3,75']),
        op('🔥 0,25 € son...',['25 céntimos','2,5 céntimos','250 céntimos'],0),
        es('🔥 10 − 7,55 = ',['2,45'])]},
 {t:'Longitud, masa, capacidad y tiempo',tri:3,exp:`<ul><li><b>Longitud:</b> 1 km = 1.000 m · 1 m = 100 cm · 1 cm = 10 mm.</li><li><b>Masa:</b> 1 kg = 1.000 g · medio kilo = 500 g.</li><li><b>Capacidad:</b> 1 l = 1.000 ml · medio litro = 500 ml.</li><li><b>Tiempo:</b> 1 hora = 60 minutos · 1 minuto = 60 segundos.</li></ul>`,ejemplo:'2,5 km = 2.500 m',
  ej:[es('1 km = ... m',['1000']),
      es('3 m = ... cm',['300']),
      es('2 kg = ... g',['2000']),
      es('1 litro = ... ml',['1000']),
      op('¿En qué medirías el agua de una bañera?',['litros','kilos','metros'],0),
      es('Una hora y cuarto son ... minutos',['75'])],
  reto:[es('🔥 2,5 km = ... m',['2500']),
        es('🔥 Medio kilo = ... g',['500']),
        es('🔥 3 horas = ... minutos',['180'])]},
 {t:'Ángulos, polígonos y perímetro',tri:3,exp:`<ul><li>Ángulo <b>recto</b> = 90°; <b>agudo</b>, menos de 90°; <b>obtuso</b>, más de 90°; <b>llano</b> = 180°.</li><li>Triángulos: <b>equilátero</b> (3 lados iguales), <b>isósceles</b> (2), <b>escaleno</b> (ninguno).</li><li>El <b>perímetro</b> es la suma de todos los lados.</li><li>El diámetro de una circunferencia mide el doble que el radio.</li></ul>`,ejemplo:'Cuadrado de 5 cm: 5 + 5 + 5 + 5 = 20 cm',
  ej:[op('Un ángulo de 90° se llama...',['recto','agudo','obtuso'],0),
      op('Un ángulo menor de 90° es...',['agudo','obtuso','llano'],0),
      es('¿Cuántos lados tiene un hexágono?',['6','seis']),
      op('Un triángulo con los tres lados iguales es...',['equilátero','isósceles','escaleno'],0),
      es('Perímetro de un cuadrado de 5 cm de lado: ... cm',['20']),
      op('Dos rectas que nunca se cortan son...',['paralelas','secantes','perpendiculares'],0)],
  reto:[es('🔥 Perímetro de un rectángulo de 8 cm por 3 cm: ... cm',['22'],'8 + 3 + 8 + 3.'),
        es('🔥 ¿Cuántos grados tiene un ángulo llano?',['180']),
        op('🔥 El radio mide 4 cm. El diámetro mide...',['8 cm','2 cm','4 cm'],0)]}
]},
{id:'len',nom:'Lengua',libro:'Lengua+ 4 · Serie Participa',unis:[
 {t:'La sílaba tónica y la tilde',tri:1,exp:`<p>La <b>sílaba tónica</b> es la que suena más fuerte.</p><ul><li><b>Agudas</b>: la última (ca-<b>mión</b>). Tilde si acaban en n, s o vocal.</li><li><b>Llanas</b>: la penúltima (<b>ár</b>-bol). Tilde si NO acaban en n, s o vocal.</li><li><b>Esdrújulas</b>: la antepenúltima (<b>pá</b>-ja-ro). Llevan tilde siempre.</li></ul>`,ejemplo:'sofá (aguda) · lápiz (llana) · música (esdrújula)',
  ej:[op('¿Cuál es la sílaba tónica de «ventana»?',['ven','ta','na'],1),
      op('«Camión» es una palabra...',['aguda','llana','esdrújula'],0),
      op('«Lápiz» es una palabra...',['aguda','llana','esdrújula'],1),
      op('«Música» es una palabra...',['aguda','llana','esdrújula'],2),
      op('¿Cuál está bien escrita?',['arbol','árbol','arból'],1,'Llana acabada en l: lleva tilde.'),
      op('Las esdrújulas llevan tilde...',['siempre','nunca','solo si acaban en n'],0)],
  reto:[op('🔥 ¿Cuál es aguda y lleva tilde?',['reloj','sofá','mesa'],1),
        op('🔥 «Examen» es llana y acaba en n, así que...',['no lleva tilde','lleva tilde'],0),
        op('🔥 ¿Cuál está bien escrita?',['murciélago','murcielago','murcíelago'],0)]},
 {t:'El sustantivo',tri:1,exp:`<p>Los <b>sustantivos</b> nombran personas, animales, cosas o lugares.</p><ul><li><b>Comunes</b> (ciudad) y <b>propios</b> (Murcia), que van con mayúscula.</li><li>Tienen <b>género</b> (masculino/femenino) y <b>número</b> (singular/plural).</li><li><b>Colectivos</b>: nombran un grupo (enjambre, bosque).</li><li><b>Diminutivos</b> (casita) y <b>aumentativos</b> (casona).</li></ul>`,ejemplo:'lápiz → lápices · pez → peces',
  ej:[op('¿Cuál es un sustantivo propio?',['ciudad','Murcia','río'],1),
      op('El femenino de «actor» es...',['actora','actriz','actoresa'],1),
      es('Escribe el plural de «lápiz»',['lápices']),
      op('Colectivo de «abejas»',['enjambre','rebaño','manada'],0),
      op('«Casita» es un...',['diminutivo','aumentativo','colectivo'],0),
      es('Escribe el plural de «pez»',['peces'])],
  reto:[op('🔥 Colectivo de «árboles»',['bosque','flota','jauría'],0),
        es('🔥 Plural de «ratón»',['ratones']),
        op('🔥 Aumentativo de «casa»',['casona','casita','caserío'],0)]},
 {t:'El adjetivo',tri:1,exp:`<p>El <b>adjetivo</b> dice cómo es el sustantivo y concuerda con él en <b>género y número</b>.</p><ul><li>Positivo: alto · Comparativo: más alto que · Superlativo: altísimo.</li><li>Muchos adjetivos salen de sustantivos: sol → soleado.</li></ul>`,ejemplo:'la niña alegre · las flores rojas',
  ej:[op('En «la niña alegre», el adjetivo es...',['la','niña','alegre'],2),
      op('Lo contrario de «alto» es...',['bajo','grande','largo'],0),
      es('Completa: las flores (rojo) → las flores ...',['rojas']),
      op('Superlativo de «grande»',['grandísimo','más grande','grande'],0),
      op('El adjetivo concuerda con el sustantivo en...',['género y número','solo número','nada'],0),
      es('Adjetivo que viene de «sol»: un día ...',['soleado'])],
  reto:[op('🔥 «Más alto que» es grado...',['comparativo','superlativo','positivo'],0),
        es('🔥 Superlativo de «fácil»',['facilísimo']),
        op('🔥 El adjetivo de «Mi perro tiene el pelo suave» es...',['suave','pelo','tiene'],0)]},
 {t:'Determinantes y pronombres',tri:2,exp:`<ul><li><b>Artículos:</b> el, la, los, las, un, una…</li><li><b>Demostrativos:</b> este, ese, aquel (dicen cerca o lejos).</li><li><b>Posesivos:</b> mi, tu, su, nuestro (dicen de quién es).</li><li><b>Numerales:</b> tres, primero…</li><li><b>Pronombres personales:</b> yo, tú, él, ella, nosotras, vosotros, ellas… sustituyen al nombre.</li></ul>`,ejemplo:'Lucía canta → Ella canta',
  ej:[op('¿Cuál es un artículo?',['la','mesa','bonita'],0),
      op('En «este libro», «este» es...',['demostrativo','posesivo','artículo'],0),
      op('«Mi», «tu», «su» son...',['posesivos','numerales','verbos'],0),
      op('Pronombre para «Ana y yo»',['nosotras','ellas','vosotras'],0),
      op('«Lucía canta» → «... canta»',['Ella','Él','Nosotras'],0),
      op('En «tres gatos», «tres» es...',['numeral','posesivo','demostrativo'],0)],
  reto:[op('🔥 En «aquellas montañas», «aquellas» indica...',['lejanía','cercanía','posesión'],0),
        op('🔥 «Pedro y tú» → pronombre',['vosotros','nosotros','ellos'],0),
        op('🔥 En «nuestra clase», «nuestra» es...',['posesivo','artículo','demostrativo'],0)]},
 {t:'El verbo',tri:2,exp:`<p>El <b>verbo</b> dice acciones. Su nombre es el <b>infinitivo</b>: cantar (1.ª conjugación), comer (2.ª), vivir (3.ª).</p><ul><li>Tiempos: <b>pasado</b> (canté), <b>presente</b> (canto), <b>futuro</b> (cantaré).</li><li>Persona y número: yo (1.ª sing.), nosotros (1.ª plural)…</li></ul>`,ejemplo:'Ayer jugué · Hoy juego · Mañana jugaré',
  ej:[op('Infinitivo de «cantaba»',['cantar','canto','cantado'],0),
      op('«Comeré» está en...',['futuro','pasado','presente'],0),
      op('«Ayer jugué» está en...',['pasado','presente','futuro'],0),
      op('«Vivir» es de la...',['tercera conjugación','primera conjugación','segunda conjugación'],0),
      es('Presente de «saltar» con «yo»: yo ...',['salto']),
      op('«Nosotros corremos» está en...',['1.ª persona plural','3.ª persona singular','2.ª persona plural'],0)],
  reto:[es('🔥 Futuro: yo (bailar) → yo ...',['bailaré']),
        op('🔥 «Temer» es de la...',['segunda conjugación','primera conjugación','tercera conjugación'],0),
        es('🔥 Pasado: ella (escribir) → ella ...',['escribió'])]},
 {t:'Ortografía: b/v, g/j y h',tri:3,exp:`<ul><li>Con <b>b</b>: los pasados en -aba (cantaba), y las palabras con bl, br (hablar, libro).</li><li>Con <b>v</b>: después de n (enviar) y los adjetivos en -avo, -ivo (octavo, activo).</li><li>Con <b>j</b>: palabras acabadas en -aje (viaje).</li><li>Con <b>g</b>: los verbos en -ger, -gir (coger, dirigir).</li><li>Con <b>h</b>: las que empiezan por hie-, hue- (hielo, huevo).</li></ul>`,ejemplo:'cantaba · viaje · huevo · enviar',
  ej:[op('¿Cuál está bien escrita?',['hablar','ablar','havlar'],0),
      op('¿Cuál está bien escrita?',['cantaba','cantava'],0),
      op('¿Cuál está bien escrita?',['jirafa','girafa'],0),
      op('¿Cuál está bien escrita?',['hielo','ielo','yelo'],0),
      op('¿Cuál está bien escrita?',['enviar','embiar','enbiar'],0),
      op('¿Cuál está bien escrita?',['coger','cojer'],0)],
  reto:[op('🔥 ¿Cuál está bien escrita?',['huevo','güevo','uevo'],0),
        op('🔥 ¿Cuál está bien escrita?',['viaje','viage'],0),
        op('🔥 ¿Cuál está bien escrita?',['activo','actibo'],0)]},
 {t:'La oración: sujeto y predicado',tri:3,exp:`<p>La <b>oración</b> tiene sentido completo. Se divide en <b>sujeto</b> (quién) y <b>predicado</b> (qué se dice del sujeto). El núcleo del predicado es el <b>verbo</b>.</p><ul><li>Enunciativa: Hace frío. · Interrogativa: ¿Hace frío? · Exclamativa: ¡Qué frío!</li></ul>`,ejemplo:'[Mi abuela] [cocina paella]',
  ej:[op('Sujeto de «Las niñas juegan al fútbol»',['Las niñas','juegan','al fútbol'],0),
      op('El núcleo del predicado es...',['el verbo','el sustantivo','el adjetivo'],0),
      op('¿Cuál es interrogativa?',['¿Vienes mañana?','Vengo mañana.','¡Qué bien!'],0),
      op('Predicado de «Mi abuela cocina paella»',['cocina paella','Mi abuela','paella'],0),
      op('¿Cuál es exclamativa?',['¡Qué frío hace!','Hace frío.','¿Hace frío?'],0),
      es('El verbo de «El gato duerme en el sofá» es...',['duerme'])],
  reto:[op('🔥 Sujeto de «Ayer llegaron mis primas»',['mis primas','Ayer','llegaron'],0,'¿Quién llegó?'),
        es('🔥 El verbo de «Mañana iremos al parque»',['iremos']),
        op('🔥 «¡Cuidado!» es una oración...',['exclamativa','interrogativa','enunciativa'],0)]}
]},
{id:'nat',nom:'Ciencias de la Naturaleza',libro:'Ciencias de la Naturaleza 4',unis:[
 {t:'La digestión',tri:1,exp:`<p>El <b>aparato digestivo</b> transforma los alimentos en nutrientes.</p><ul><li>Recorrido: boca → esófago → estómago → intestino delgado → intestino grueso → ano.</li><li>En la boca se forma el <b>bolo alimenticio</b> con la saliva.</li><li>En el intestino delgado los nutrientes pasan a la <b>sangre</b>.</li><li>El <b>hígado</b> y el páncreas ayudan con sus jugos.</li></ul>`,ejemplo:'Boca → esófago → estómago → intestinos',
  ej:[op('¿Cuál es el orden correcto?',['boca → esófago → estómago → intestino','boca → estómago → esófago → intestino','esófago → boca → intestino → estómago'],0),
      op('Los alimentos se mezclan con los jugos gástricos en...',['el estómago','la boca','el esófago'],0),
      op('Los nutrientes pasan a la sangre en...',['el intestino delgado','el intestino grueso','la boca'],0),
      es('¿Cuántos dientes definitivos tiene un adulto?',['32']),
      op('Órgano que fabrica la bilis',['el hígado','el corazón','el pulmón'],0),
      op('La saliva sirve para...',['ablandar y empezar a digerir','respirar','ver mejor'],0)],
  reto:[op('🔥 El bolo alimenticio se forma en...',['la boca','el intestino','el hígado'],0),
        op('🔥 En el intestino grueso...',['se absorbe agua y se forman las heces','se mastica','se fabrica saliva'],0),
        op('🔥 La nutrición incluye...',['digestión, respiración, circulación y excreción','solo comer','solo dormir'],0)]},
 {t:'Respiración, circulación y excreción',tri:1,exp:`<ul><li><b>Respiración:</b> tomamos oxígeno y expulsamos dióxido de carbono. El intercambio ocurre en los <b>alvéolos</b> de los pulmones.</li><li><b>Circulación:</b> el corazón (4 cavidades) bombea la sangre. Las <b>arterias</b> la llevan desde el corazón; las <b>venas</b>, hacia él.</li><li><b>Excreción:</b> los <b>riñones</b> limpian la sangre y forman la orina.</li></ul>`,ejemplo:'Oxígeno entra · dióxido de carbono sale',
  ej:[op('Gas que tomamos al respirar',['oxígeno','dióxido de carbono','helio'],0),
      op('Gas que expulsamos',['dióxido de carbono','oxígeno','hidrógeno'],0),
      es('¿Cuántas cavidades tiene el corazón?',['4','cuatro']),
      op('Vasos que llevan la sangre DESDE el corazón',['arterias','venas','capilares'],0),
      op('El intercambio de gases ocurre en...',['los alvéolos','el estómago','los riñones'],0),
      op('Órganos que forman la orina',['los riñones','los pulmones','el estómago'],0)],
  reto:[op('🔥 Las venas llevan la sangre...',['hacia el corazón','desde el corazón','solo a los pies'],0),
        op('🔥 Músculo que está debajo de los pulmones',['el diafragma','el bíceps','el corazón'],0),
        op('🔥 La orina se guarda en...',['la vejiga','el hígado','el estómago'],0)]},

/* ============ PRÁCTICA SIN FIN (matemáticas) ============ */
const az=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const miles=n=>n.toLocaleString('es-ES');
const coma=n=>n.toFixed(2).replace('.',',');
const GEN={
 'Números de hasta seis cifras':()=>{const n=az(100000,999999);return [
   es(`Número siguiente a ${miles(n)}`,[String(n+1)]),es(`Número anterior a ${miles(n)}`,[String(n-1)]),
   es(`${miles(Math.floor(n/1000)*1000)} + ${n%1000} = `,[String(n)])][az(0,2)];},
 'Sumas y restas grandes':()=>{const a=az(1000,9999),b=az(1000,9999);return Math.random()<.5?es(`${miles(a)} + ${miles(b)} = `,[String(a+b)]):es(`${miles(Math.max(a,b))} − ${miles(Math.min(a,b))} = `,[String(Math.abs(a-b))]);},
 'Multiplicar por dos cifras':()=>{const a=az(12,99),b=az(11,49);return es(`${a} × ${b} = `,[String(a*b)]);},
 'La división':()=>{const d=az(2,9),c=az(11,120);return es(`${miles(d*c)} : ${d} = `,[String(c)]);},
 'Las fracciones':()=>{const d=[2,3,4,5,6,8,10][az(0,6)],n=az(1,d-1),k=az(2,9);return es(`${n}/${d} de ${d*k} = `,[String(n*k)]);},
 'Números decimales y dinero':()=>{const a=az(100,900)/100,b=az(100,900)/100;return es(`${coma(a)} € + ${coma(b)} € = `,[coma(a+b)]);},
 'Longitud, masa, capacidad y tiempo':()=>{const n=az(2,9);return [es(`${n} km = ... m`,[String(n*1000)]),es(`${n} m = ... cm`,[String(n*100)]),es(`${n} kg = ... g`,[String(n*1000)]),es(`${n} horas = ... minutos`,[String(n*60)])][az(0,3)];},
 'Ángulos, polígonos y perímetro':()=>{const a=az(3,15),b=az(2,12);return es(`Perímetro de un rectángulo de ${a} cm por ${b} cm: ... cm`,[String(2*(a+b))]);}
};

function marcarDia(){if(E.ultimo===HOY)return;const ay=new Date(Date.now()-864e5).toISOString().slice(0,10);E.racha=E.ultimo===ay?E.racha+1:1;E.ultimo=HOY;}

/* ============ UTILIDADES ============ */
const $=s=>document.querySelector(s);
const escH=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(s){return String(s).toLowerCase().trim().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[€\s]/g,'').replace(/(\d)\.(?=\d{3}(\D|$))/g,'$1').replace(/(\d)\.(\d)/g,'$1,$2').replace(/,0+$/,'').replace(/(,\d)0$/,'$1');}
/* Voz de mujer en español: la primera que encuentre el navegador (Windows, Android, Apple o Google). */
const MUJER=/helena|laura|elvira|elena|paloma|lucia|lucía|monica|mónica|paulina|sabina|dalia|marisol|esperanza|conchita|penelope|female|mujer/i;
let VOZ=null;
function elegirVoz(){try{const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
  VOZ=vs.find(v=>/es-ES/i.test(v.lang)&&MUJER.test(v.name))||vs.find(v=>MUJER.test(v.name))||vs.find(v=>/google/i.test(v.name)&&/es-ES/i.test(v.lang))||vs.find(v=>/es-ES/i.test(v.lang))||vs[0]||null;}catch(e){}}
/* Voz árabe: de mujer si el aparato la tiene (Hoda, Salma, Zariyah, Laila…), si no, la árabe que haya. */
const MUJER_AR=/hoda|salma|zariyah|laila|layla|mariam|amira|fatima|female|mujer/i;
let VOZ_AR=null;
function elegirVozAr(){try{const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));VOZ_AR=vs.find(v=>MUJER_AR.test(v.name))||vs[0]||null;}catch(e){}}
try{elegirVoz();elegirVozAr();speechSynthesis.onvoiceschanged=()=>{elegirVoz();elegirVozAr();};}catch(e){}
/* Pulsar un altavoz mientras habla = parar. El botón flotante «Parar» también corta en cualquier momento. */
function hablar(t,alternar,ar){try{
  if(alternar&&speechSynthesis.speaking){callar();return;}
  const u=new SpeechSynthesisUtterance(t);
  if(ar){u.lang='ar-SA';u.rate=.8;if(VOZ_AR)u.voice=VOZ_AR;}else{u.lang='es-ES';u.rate=.9;u.pitch=1.15;if(VOZ)u.voice=VOZ;}
  u.onend=u.onerror=()=>{if(!speechSynthesis.speaking)$('#parar').hidden=true;};
  speechSynthesis.cancel();speechSynthesis.speak(u);$('#parar').hidden=false;}catch(e){}}
function callar(){try{speechSynthesis.cancel();}catch(e){}$('#parar').hidden=true;}
function leerPregunta(){const q=L.lista[L.k];hablar(q.q.replace(/🔥/g,'').replace(/\.\.\./g,', ')+(q.t==='op'?'. '+q.o.join('. '):''),true);}
function pintarBarra(){$('#pts').textContent=E.pts;$('#racha').textContent=E.racha;if(E.nombre)$('#marca-barra').innerHTML=marca(E.nombre,'24px');}

/* ============ DEBERES DE MATEMÁTICAS ============ */
/* 10 ejercicios por día de las unidades de matemáticas hasta el trimestre actual.
   Se guardan al generarlos: los deberes de hoy no cambian aunque cierre y vuelva a abrir. */
function deberesHoy(){
  if(E.deb&&E.deb.fecha===HOY)return E.deb;
  const mat=MATERIAS.find(m=>m.id==='mat');
  const unis=mat.unis.filter(u=>u.tri<=triActual());
  const lista=Array.from({length:10},(_,j)=>{const u=unis[j%unis.length];
    return j%4===3?u.ej[az(0,u.ej.length-1)]:GEN[u.t]();}).sort(()=>Math.random()-.5);
  E.deb={fecha:HOY,lista,nota:null};guardar();return E.deb;
}
function tarjetaDeberes(){
  const d=deberesHoy(),hist=Object.entries(E.debHist||{}).sort().slice(-7);
  const fecha=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  return `<div class="hoy"><span class="flor">${d.nota?'✅':'📝'}</span><div class="txt">
    <b>${d.nota?`Deberes hechos: ${d.nota}`:'Deberes de hoy sin hacer'}</b><span style="text-transform:capitalize">${fecha}</span>
    ${hist.length?`<div class="mandos" style="margin-top:6px">${hist.map(([f,n])=>`<span class="chip" title="${f}">${f.slice(8)}/${f.slice(5,7)} · ${n}</span>`).join('')}</div>`:''}</div>
    <button class="btn" onclick="hacerDeberes()">${d.nota?'Repasar':'Hacer los deberes'}</button></div>`;
}
function hacerDeberes(){const d=deberesHoy();L={id:'deb',i:0,modo:'deb',lista:d.lista,k:0,res:[],hecha:false};pregunta();}

function empezar(id,i,modo){
  const u=MATERIAS.find(x=>x.id===id).unis[i];
  const lista=modo==='gen'?Array.from({length:8},()=>GEN[u.t]()):u[modo];

}
function pregunta(){callar();
  const q=L.lista[L.k],deb=L.modo==='deb';
  const titulo=deb?'Inicio':MATERIAS.find(x=>x.id===L.id).unis[L.i].t;
  L.hecha=false;
  $('#vista').innerHTML=`<button class="volver" onclick="${deb?'inicio()':`leccion('${L.id}',${L.i})`}"><span class="flecha" aria-hidden="true">←</span>${escH(titulo)}</button>
  <div class="leccion">${deb?'<h1 style="font-size:24px;margin-bottom:8px">📝 Deberes de Matemáticas</h1>':''}<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px"><div class="estrella-prog" id="eprog" style="--p:${L.k/L.lista.length}" title="Tu estrella se enciende con cada ejercicio">${estrellaSola()}</div>
   <div class="pasos" style="margin:0">${L.lista.map((x,j)=>`<i class="${L.res[j]===true?'si':L.res[j]===false?'no':j===L.k?'ya':''}"></i>`).join('')}</div></div>
   <p class="nota">${L.modo==='reto'?'🔥 Reto':L.modo==='gen'?'♾️ Práctica sin fin':deb?'Deber':'Ejercicio'} ${L.k+1} de ${L.lista.length}</p>
   <div class="preg" style="display:flex;gap:10px;align-items:flex-start"><button class="icono" onclick="leerPregunta()" aria-label="Leer la pregunta en voz alta" title="Escuchar">🔊</button><span>${escH(q.q)}</span></div>
   ${q.t==='op'?`<div class="ops">${q.o.map((o,j)=>`<button class="op" data-j="${j}" onclick="responder(${j})">${escH(o)}</button>`).join('')}</div>`
     :`<form class="entrada" onsubmit="event.preventDefault();responder($('#resp').value)"><input id="resp" autocomplete="off" inputmode="${/\d/.test(q.r[0])?'decimal':'text'}" placeholder="Tu respuesta"><button class="btn">Comprobar</button></form>`}
   <div id="ver"></div></div>`;
  const inp=$('#resp');if(inp)inp.focus();
}
function responder(v){
  if(L.hecha)return;const q=L.lista[L.k];
  const bien=q.t==='op'?v===q.r:q.r.some(r=>norm(r)===norm(v));
  if(q.t==='esc'&&!String(v).trim())return;
  L.hecha=true;L.res[L.k]=bien;
  const ep=$('#eprog');if(ep){ep.style.setProperty('--p',(L.k+1)/L.lista.length);ep.classList.remove('chispa');void ep.offsetWidth;ep.classList.add('chispa');}
  if(q.t==='op')document.querySelectorAll('.op').forEach(b=>{const j=+b.dataset.j;if(j===q.r)b.classList.add('si');else if(j===v)b.classList.add('no');b.disabled=true;});
  if(bien&&L.modo!=='deb')sumar(L.modo==='reto'?20:10);
  const correcta=q.t==='op'?q.o[q.r]:q.r[0];
  const frase=bien?['¡Muy bien! 🌸','¡Genial! ⭐','¡Perfecto! 🌷'][az(0,2)]:`Casi. La respuesta es: ${correcta}`;
  hablar(frase.replace(/[^\p{L}\p{N}\s,.:¡!¿?\/-]/gu,''));
  $('#ver').innerHTML=`<div class="veredicto ${bien?'si':'no'}">${escH(frase)}${q.p?`<br><span style="font-weight:600">${escH(q.p)}</span>`:''}</div>
   <div class="mandos"><button class="btn" id="bsig" onclick="seguir()">${L.k<L.lista.length-1?'Siguiente →':'Ver resultado'}</button></div>`;
  $('#bsig').focus();
}
function seguir(){L.k++;if(L.k<L.lista.length)pregunta();else final();}
function final(){
  const ok=L.res.filter(Boolean).length,n=L.lista.length,key=L.id+'-'+L.i;
  const aprobado=ok>=Math.ceil(n*.6);
  if(L.modo==='deb'){const primera=!E.deb.nota;E.deb.nota=`${ok}/${n}`;E.debHist=Object.assign({},E.debHist,{[HOY]:E.deb.nota});
    if(primera)sumar(ok*2);else guardar();
    $('#vista').innerHTML=`<div class="leccion fin"><div class="estrella-fin ${aprobado?'':'apagada'}">${estrellaSola()}</div>
     <h1>Deberes: ${ok} de ${n}</h1><p>${ok===n?'¡Todos bien! Mañana tendrás deberes nuevos.':aprobado?'¡Deberes hechos! Mañana, más.':'Repasa las lecciones de Matemáticas y vuelve a intentarlo.'}</p>
     <div class="mandos" style="justify-content:center"><button class="btn" onclick="hacerDeberes()">Repasar</button><button class="btn sec" onclick="inicio()">Inicio</button></div></div>`;
    return;}
  if(aprobado&&L.modo==='ej'&&!E.hechas[key]){E.hechas[key]=HOY;sumar(30);}
  if(aprobado&&L.modo==='reto'&&!E.retos[key]){E.retos[key]=HOY;sumar(50);}
  $('#vista').innerHTML=`<div class="leccion fin"><div class="estrella-fin ${aprobado?'':'apagada'}">${estrellaSola()}</div>
   <h1>${ok} de ${n}</h1><p>${ok===n?'¡Todo perfecto!':aprobado?'¡Lección superada! Tu jardín ha crecido.':'Casi lo tienes. Lee otra vez la explicación y vuelve a intentarlo.'}</p>
   <div class="mandos" style="justify-content:center"><button class="btn" onclick="empezar('${L.id}',${L.i},'${L.modo}')">Otra vez</button>
   <button class="btn sec" onclick="materia('${L.id}')">Volver al libro</button><button class="btn sec" onclick="inicio()">Inicio</button></div></div>`;
}

const HERR=[
 {ic:'✖️',nm:'Tablas de multiplicar',ds:'Del 2 al 10, con juego',f:'hTablas'},

let TQ=null;

function nuevoCalc(){let q;if(Math.random()<.5){const a=az(12,99),b=az(2,9);q=[`${a} × ${b}`,a*b];}else{const d=az(2,9),c=az(12,99);q=[`${d*c} : ${d}`,c];}
  CQ=q[1];$('#cz').innerHTML=`<div class="preg">${q[0]} = ?</div><form class="entrada" onsubmit="event.preventDefault();compCalc()"><input id="cr" inputmode="numeric" autocomplete="off"><button class="btn">Comprobar</button></form><div id="cv"></div>`;$('#cr').focus();}

let CR=null,CT=0;
function hLectura(){abrir(`<h2>Leer en voz alta</h2><p class="nota">Pulsa «Empezar», lee el texto en voz alta y pulsa «Terminé».</p>
  <div class="lectura">${LECTURA}</div><div class="mandos"><button class="btn" id="bl" onclick="lectura()">Empezar</button><span class="chip" id="lc">0 s</span></div><div id="lv"></div>`);}
function lectura(){const b=$('#bl');
  if(!CR){CT=Date.now();CR=setInterval(()=>{$('#lc').textContent=Math.round((Date.now()-CT)/1000)+' s';},250);b.textContent='Terminé';return;}
  clearInterval(CR);CR=null;const s=(Date.now()-CT)/1000,p=Math.round(LECTURA.split(/\s+/).length/(s/60));b.textContent='Otra vez';sumar(5);
  $('#lv').innerHTML=`<div class="veredicto si">${p} palabras por minuto. ${p>=90?'¡Lees muy bien para 4.º!':'En 4.º se busca llegar a unas 90–110. ¡Sigue practicando!'}</div>`;}
function hGlosario(){abrir(`<h2>Castellano ↔ عربي</h2><p class="nota">Pulsa 🔊 para oír la palabra en castellano o en árabe. El árabe lleva sus vocales (حَرَكات) para leerlo bien.</p>
  <div class="mandos" style="margin:0 0 12px"><button class="btn lila" onclick="juegoAr()">🎲 Juego: ¿cómo se dice en árabe?</button></div><div id="jz" style="margin-bottom:12px"></div>
  <input class="buscador" id="gq" placeholder="Busca una palabra…" oninput="filtra(this.value)"><div style="overflow-x:auto"><table class="glosa"><thead><tr><th>Castellano</th><th style="text-align:right">عربي</th></tr></thead><tbody id="gtb"></tbody></table></div>`);filtra('');}
function filtra(q){const n=norm(q),a=sinTashkil(q.trim());
  $('#gtb').innerHTML=GLOSA.filter(r=>!n||norm(r[0]).includes(n)||(a&&sinTashkil(r[1]).includes(a))).map(r=>`<tr>
    <td><button class="btn sec" style="padding:4px 10px" onclick='hablar(${JSON.stringify(r[0])},true)' aria-label="Escuchar en castellano">🔊</button> ${escH(r[0])}</td>
    <td dir="rtl" style="font-size:20px">${escH(r[1])} <button class="btn sec" style="padding:4px 10px" onclick='hablar(${JSON.stringify(r[1])},true,true)' aria-label="استمع بالعربية">🔊</button></td></tr>`).join('');}
/* Juego: sale una palabra en castellano, se oye en árabe y se elige la traducción. */
let JQ=null;
function juegoAr(){const i=az(0,GLOSA.length-1),malas=GLOSA.filter((r,j)=>j!==i).sort(()=>Math.random()-.5).slice(0,2);
  const ops=[GLOSA[i],...malas].sort(()=>Math.random()-.5);JQ=GLOSA[i];
  $('#jz').innerHTML=`<div class="preg">¿Cómo se dice <b>${escH(JQ[0])}</b> en árabe?</div>
   <div class="ops">${ops.map(r=>`<button class="op" dir="rtl" style="text-align:right;font-size:22px" onclick='compAr(this,${JSON.stringify(r[1])})'>${escH(r[1])}</button>`).join('')}</div><div id="jv"></div>`;}
function compAr(b,v){if($('#jv').innerHTML)return;const ok=v===JQ[1];b.classList.add(ok?'si':'no');if(ok)sumar(3);
  document.querySelectorAll('#jz .op').forEach(x=>{if(x.textContent.trim()===JQ[1])x.classList.add('si');x.disabled=true;});hablar(JQ[1],false,true);
  $('#jv').innerHTML=`<div class="veredicto ${ok?'si':'no'}">${ok?'¡Muy bien! +3 ⭐ · أَحْسَنْتِ':'Es: <span dir="rtl">'+escH(JQ[1])+'</span>'}</div><div class="mandos"><button class="btn" onclick="juegoAr()">Otra</button></div>`;}
